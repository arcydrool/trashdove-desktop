[package]
name = "trashdove-desktop"
version = "0.1.0"
edition = "2021"
build = "C:/Users/arcyd/source/repos/trashdove-desktop/src/build.rs"

[dependencies]
dirs = "6.0.0"
rocket = "0.5.1"

[dependencies.uuid]
version = "1.16.0"
# Lets you generate random UUIDs
features = [
    "v4",
]

[build-dependencies]
winresource = "0.1.20"

[dev-dependencies]
tokio = "1.44.0"
cucumber = "0.20"
